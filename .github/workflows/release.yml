name: Publish packages

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

# Mirrors the release workflow mainstream tree-sitter grammars (e.g.
# tree-sitter-rust) use: no hand-rolled build matrix, just the org's own
# reusable workflows for the GitHub release, npm (node binding, prebuilt via
# prebuildify), and crates.io (Rust binding). No Python binding here, so no
# pypi job.
jobs:
  github:
    uses: tree-sitter/workflows/.github/workflows/release.yml@main
  npm:
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@main
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  crates:
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
